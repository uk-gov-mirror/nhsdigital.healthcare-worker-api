# Vacuum OpenAPI linter configuration
# https://quobix.com/vacuum/configuration/
#
# Rules suppressed here are inapplicable to this API, not genuine issues:
#
# - resolving-references: The securitySchemes $ref points to an internal NHS
#   proxygen URL that is resolved at deploy time, not fetchable by a linter.
#
# - oas3-unused-component: False positive caused by the above unresolvable
#   external $ref — vacuum can't see it's used.
#
# - paths-kebab-case: This is a FHIR API. FHIR resource paths use PascalCase
#   by convention (e.g. /Practitioner, /PractitionerRole).
#
# - description-duplication: Multiple endpoints legitimately share identical
#   HTTP status code descriptions (e.g. 404, 429). This is expected for a
#   REST API with common error responses.

extends: [[spectral:oas, recommended]]

rules:
  resolving-references: hint
  oas3-unused-component: hint
  paths-kebab-case: off
  description-duplication: off
