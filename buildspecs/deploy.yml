# This is triggered as part of the codepipeline pipelines to deploy a specific build to an environment. It takes in
# the environment name and the s3 filename of the build zip for the lambda.
# There is one instance of this job in every HCW AWS account, with it responsible for making changes any infrastructure
# changes as required.
version: 0.2

env:
  variables:
    environment_name: ""
    account_name: ""
    app_s3_filename: ""

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - yum install -y yum-utils
      - yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - yum -y install terraform
      - terraform --version
      - pip install proxygen-cli
      - wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
      - chmod +x /usr/bin/yq
  build:
    commands:
      - cd infrastructure
      - terraform init
      - |
        if expr "${environment_name}" : "ft" >/dev/null; then
          # Since we're deploying to ft we want to make sure we deploy the mgmt infra too (we don't do this on
          # every branch otherwise it'll conflict)
          # There's two parts to this:
          # 1) The management account itself
          # 2) Resources shared between environments within an account
          # So we're going to do both deployments here
          terraform workspace select management
          terraform plan -var-file="environments/mgmt.tfvars" -out tf.plan
          terraform apply tf.plan

          terraform workspace select mgmt
          terraform plan -var-file="environments/${account_name}.tfvars" -out tf.plan
          terraform apply tf.plan
        fi
      - |
        if expr "${environment_name}" : "int" >/dev/null; then
          # INT and PROD are in their own accounts, so need their own mgmt workspaces
          terraform workspace select mgmt-int
          terraform plan -var-file="environments/${account_name}.tfvars" -out tf.plan
          terraform apply tf.plan
        fi
      - |
        if expr "${environment_name}" : "prod" >/dev/null; then
          # INT and PROD are in their own accounts, so need their own mgmt workspaces
          terraform workspace select mgmt-prod
          terraform plan -var-file="environments/${account_name}.tfvars" -out tf.plan
          terraform apply tf.plan
        fi
      - terraform workspace select -or-create ${environment_name}
      - terraform plan -var-file="environments/${account_name}.tfvars" -var "app_s3_filename=${app_s3_filename}" -out tf.plan
      
      # Import existing log groups that may have been auto-created by AWS
      # This prevents "already exists" errors when transitioning to Terraform management
      terraform import -var-file="environments/${account_name}.tfvars" -var "app_s3_filename=${app_s3_filename}" 'module.app[0].aws_cloudwatch_log_group.lambda_log_group' "/aws/lambda/hcw-app-${environment_name}" 2>/dev/null || true
      terraform import -var-file="environments/${account_name}.tfvars" -var "app_s3_filename=${app_s3_filename}" 'module.app[0].aws_cloudwatch_log_group.log_transformer_log_group' "/aws/lambda/log-transformer-${environment_name}" 2>/dev/null || true
      
      # For API Gateway access logs, we need to get the actual API Gateway ID first
      if terraform state show 'module.app[0].aws_api_gateway_rest_api.app_api' >/dev/null 2>&1; then
        API_GW_ID=$(terraform state show 'module.app[0].aws_api_gateway_rest_api.app_api' | grep 'id.*=' | head -1 | cut -d'"' -f2)
        terraform import -var-file="environments/${account_name}.tfvars" -var "app_s3_filename=${app_s3_filename}" 'module.app[0].aws_cloudwatch_log_group.gateway_access_log_group' "/API-Gateway-Access-Logs_${API_GW_ID}/live" 2>/dev/null || true
      fi
      
      terraform apply tf.plan

