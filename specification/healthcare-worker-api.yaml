openapi: 3.0.3
info:
  version: __VERSION__
  title: Healthcare Worker API
  description: |
    ## Overview
    Use this API to access details of healthcare workers registered in the [Care Identity Service (CIS)](https://digital.nhs.uk/services/care-identity-service) directory.

    You can:
    - get basic professional details of any healthcare worker with an active care identity, using their unique ID (this is sometimes known as SDS user ID or Smartcard ID)
    - get details of the [national RBAC](https://digital.nhs.uk/services/care-identity-service/applications-and-services/cis2-authentication/integrate/design-and-build/national-rbac-for-developers) roles that have been assigned to them by their Registration Authority

    You cannot currently use this API to:
    - search by professional codes, such as GMC or RNC code
    - get details of 'directly assigned' activities associated with the healthcare worker's role profiles (see below)

    ### Directly assigned activities
    [National RBAC](https://digital.nhs.uk/services/care-identity-service/applications-and-services/cis2-authentication/integrate/design-and-build/national-rbac-for-developers) is the method CIS uses to manage user permissions.

    In national RBAC:
    - users are assigned 'role profiles'
    - each role profile is linked to a single 'role'
    - each role is linked to zero or more 'activities' - the things the user is allowed to do
    - a role profile can also have 'directly assigned' activities

    So the total set of activities for a given role profile includes:
    - the activities that can be inferred from the role
    - the directly assigned activities

    Currently, this API only provides details of the users' roles, not their directly assigned activities. We plan to add directly assigned activities in a future release.

    ## Who can use this API
    This API can only be used where there is a legal basis to do so. Make sure you have a valid use case before you go too far with your development.

    You must do this before you can go live (see [Onboarding](#overview--onboarding)).

    ## Related APIs
    The following APIs are related to this one:
    - [Spine Directory Service - LDAP API](https://digital.nhs.uk/developer/api-catalogue/spine-directory-service-ldap) - The legacy API for accessing healthcare worker information in CIS. Only available on HSCN and being planned for deprecation at some point.
    - [Organisation Data Terminology - FHIR API](https://digital.nhs.uk/developer/api-catalogue/organisation-data-terminology) - Get organisation information from the Organisation Data Service (ODS), including some limited information on some prescribing staff at each organisation.

    ## API status and roadmap
    This API is in [beta](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#statuses).

    For details of future changes, see the [Care Identity Service roadmap](https://digital.nhs.uk/services/care-identity-service/roadmap).

    ## Service level
    This API is a silver service during beta, meaning it is operational 24 hours a day, 7 days a week but only supported during business hours (8am to 6pm), Monday to Friday excluding bank holidays.

    For more details, see [service levels](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#service-levels).

    ## Technology
    This API is [RESTful](https://digital.nhs.uk/developer/guides-and-documentation/our-api-technologies#basic-rest).

    It conforms to the [FHIR](https://digital.nhs.uk/developer/guides-and-documentation/our-api-technologies#fhir) global standard for health care data exchange, specifically to [FHIR R4 (v4.0.1)](https://hl7.org/fhir/r4/), except that it does not support the [capabilities](http://hl7.org/fhir/R4/http.html#capabilities) interaction.

    It includes some country-specific FHIR extensions, which conform to [FHIR UK Core](https://digital.nhs.uk/services/fhir-uk-core), specifically [fhir.r4.ukcore.stu1 0.5.1](https://simplifier.net/packages/fhir.r4.ukcore.stu1/0.5.1).

    You do not need to know much about FHIR to use this API - FHIR APIs are just RESTful APIs that follow specific rules. In particular:
    - resource names are capitalised and singular, for example `/Endpoint` not `/endpoints`

    ## Network access
    This API is available on the internet and, indirectly, on the [Health and Social Care Network (HSCN).](https://digital.nhs.uk/services/health-and-social-care-network)

    For more details see [Network access for APIs](https://digital.nhs.uk/developer/guides-and-documentation/network-access-for-apis).

    ## Security and authorisation
    This API is [application-restricted](https://digital.nhs.uk/developer/guides-and-documentation/security-and-authorisation#application-restricted-apis), meaning we authenticate the calling application but not the end user.

    To use this API, use the following security pattern:

    * [Application-restricted RESTful APIs - signed JWT authentication](https://digital.nhs.uk/developer/guides-and-documentation/security-and-authorisation/application-restricted-restful-apis-signed-jwt-authentication)

    ## Errors
    We use standard HTTP status codes to show whether an API request succeeded or not. They are usually in the range:

    * 200 to 299 if it succeeded, including code 202 if it was accepted by an API that needs to wait for further action
    * 400 to 499 if it failed because of a client error by your application
    * 500 to 599 if it failed because of an error on our server

    Error handling in this API follows [NHS guidelines](https://nhsconnect.github.io/FHIR-SpineCore/resources_error_handling.html) and produces an [OperationOutcome](https://fhir.nhs.uk/STU3/StructureDefinition/Spine-OperationOutcome-1) FHIR resource response with appropriate HTTP code.

    Errors specific to each API are shown in the Endpoints section, under Response. See our [reference guide](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#http-status-codes) for more on errors.

    ## Open source
    You might find the following [open source](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#open-source) resources useful:

    | Resource                | Description                                                       | Links                                                                                                                                        |
    | ----------------------- | ----------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------- |
    | API source code         | The full Healthcare Worker API codebase is open source in GitHub. | [GitHub](https://github.com/NHSDigital/healthcare-worker-api)                                                                                |
    | Postman collection      | Export of our Postman collection for use with the API.            | [GitHub](https://github.com/NHSDigital/healthcare-worker-api/tree/develop/postman)
    | FHIR libraries and SDKs | Various open source libraries for integrating with FHIR APIs.     | [FHIR libraries and SDKs](https://digital.nhs.uk/developer/guides-and-documentation/api-technologies-at-nhs-digital#fhir-libraries-and-sdks) |

    ## Environments and testing
    | Environment       | Base URL
    | ----------------- | ---------------------------------------------------------------------|
    | Sandbox           | `https://sandbox.api.service.nhs.uk/healthcare-worker`               |
    | Integration test  | `https://int.api.service.nhs.uk/healthcare-worker`                   |
    | Production        | `https://api.service.nhs.uk/healthcare-worker`                       |

    ### Sandbox testing
    Our [sandbox environment](https://digital.nhs.uk/developer/guides-and-documentation/testing#sandbox-testing):
    - is for early developer testing
    - only covers a limited set of scenarios
    - is open-access, so does not allow you to test authorisation

    For more details on sandbox testing, or to try out the sandbox using our 'Try this API' feature, see the documentation for each endpoint.

    ### Integration testing
    Our [integration test environment](https://digital.nhs.uk/developer/guides-and-documentation/testing#integration-testing):
    - is for developer testing and formal integration testing
    - is used to confirm you are ready for production
    - includes application authentication

    Read about [setting up test data in our path to live environments](https://digital.nhs.uk/services/path-to-live-environments/setting-up-test-data-in-our-path-to-live-environments).

    ## Onboarding
    You need to get your software approved by us before it can go live with this API. We call this onboarding. The onboarding process can sometimes be quite long, so it's worth planning well ahead.

    To understand how our online digital onboarding process works, see [digital onboarding](https://digital.nhs.uk/developer/guides-and-documentation/digital-onboarding).

    To get started, sign in or create a [developer account](https://onboarding.prod.api.platform.nhs.uk/), then select 'Digital onboarding service'.

  contact:
    name: Spine Directory Service API Support
    url: https://digital.nhs.uk/developer/help-and-support
    email: api.management@nhs.net
security:
  - app-level3: []
servers:
  - url: https://sandbox.api.service.nhs.uk/healthcare-worker
    description: Sandbox environment
x-nhsd-apim:
  monitoring: true
  access:
    - title: "Application Restricted"
      grants:
        app-level3: []
  target:
    type: external
    healthcheck: /
    url:
    security:
      type: mtls
      secret: hcw-mtls
  ratelimiting:
    proxy:
      timeunit: "second"
      limit: 10
paths:
  /Practitioner:
    get:
      summary: Get healthcare worker details
      operationId: getPractitioner
      description: |
        # Overview
        Use this endpoint to get details of a healthcare worker registered in the Care Identity Service (CIS), using their CIS unique identifier.

        Only active accounts are returned. If the care identity itself is closed, the endpoint returns a 410 (Gone) response.

        You can also get details of the healthcare worker's [national RBAC roles](https://digital.nhs.uk/services/care-identity-service/applications-and-services/cis2-authentication/integrate/design-and-build/national-rbac-for-developers),
        using the `_revinclude` query parameter. This currently does not include details of directly assigned activities, as explained in the [main overview](#overview--overview).

      parameters:
        - in: query
          name: identifier
          description: CIS unique identifier for the healthcare worker (sometimes known as the UUID, SDS user ID or smartcard ID).
          required: true
          schema:
            type: string
          example: '123456789012'
        - in: query
          name: _revinclude
          description: Specifies other information to be included along with the healthcare worker, using the FHIR 'reverse include' syntax. Specifying `PractitionerRole:practitioner` will include the healthcare worker's roles.
          required: false
          schema:
            type: string
            enum: [PractitionerRole:practitioner]
          example: 'PractitionerRole:practitioner'
        - $ref: '#/components/parameters/BearerAuthorization'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Correlation-Id:
              description: The X-Correlation-ID from the request header, if supplied, mirrored back.
              schema:
                type: string
              example: 11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              examples:
                basic:
                  summary: Basic response (without roles)
                  externalValue: 'components/examples/GetHealthcareWorkerDetailsResponseSuccessBasic.json'
                with-includes:
                  summary: Response with roles included
                  externalValue: 'components/examples/GetHealthcareWorkerDetailsResponseSuccessWithIncludes.json'
        '4XX':
          description: |
            An error occurred as follows:

            | HTTP status | Error code                      | Description                                                                                                                                |
            | ----------- | ------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------ |
            | 400         | MISSING_VALUE                   | Required request parameter missing, for example `identifier`.                                                                              |
            | 401         | ACCESS_DENIED                   | Access token missing, invalid or expired, or calling application not configured for this operation.                                        |
            | 404         | RESOURCE_NOT_FOUND              | No healthcare worker record found for the given CIS identifier.                                                                            |
            | 410         | INACTIVE_ACCOUNT                | The requested healthcare worker record is inactive in CIS.                                                                                 |
            | 429         | TOO_MANY_REQUESTS               | You have exceeded your application's [rate limit](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#rate-limits).  |

            For more details, see [HTTP status codes](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#http-status-codes).

          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              example:
                $ref: 'components/examples/GetHealthcareWorkerDetailsResponseError.json'
  /PractitionerRole:
    get:
      summary: Get healthcare worker role details
      operationId: getPractitionerRole
      description: |
        # Overview
        Use this endpoint to get details of healthcare worker roles in the Care Identity Service (CIS). It takes a CIS unique identifier
        as input and returns all the roles associated with that healthcare worker.

        You can get more information on the healthcare worker and the organisations linked to the roles using the `_include` query parameter.

        This endpoint currently does not include details of directly assigned activities, as explained in the [main overview](#overview--overview).

      parameters:
        - in: query
          name: practitioner.identifier
          description: CIS unique identifier (sometimes known as the UUID, SDS user ID or smartcard ID)
          required: true
          example: '123456789012'
          schema:
            type: string
          explode: true
        - in: query
          name: _include
          description: |
            Specifies other information to be included along with the roles, using the FHIR 'include' syntax.
            Specifying `PractitionerRole:practitioner` will include the healthcare worker's personal details.
            Specifying `PractitionerRole:organization` will include the organisation associated with the role.
            If you want both, include this parameter multiple times with different values.
          required: false
          schema:
            type: string
            enum: [PractitionerRole:practitioner,PractitionerRole:organization]
        - $ref: '#/components/parameters/BearerAuthorization'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Successful operation
          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/Bundle'
              examples:
                basic:
                  summary: Basic response (without practitioner or organisation included)
                  externalValue: 'components/examples/GetHealthcareWorkerRoleDetailsResponseSuccessBasic.json'
                with-includes:
                  summary: Response with practitioner and organisations included
                  externalValue: 'components/examples/GetHealthcareWorkerRoleDetailsResponseSuccessWithIncludes.json'
        '4XX':
          description: |
            An error occurred as follows:

            | HTTP status | Error code                      | Description                                                                                                                                |
            | ----------- | ------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------ |
            | 400         | MISSING_VALUE                   | Required request parameter missing, for example `practitioner.identifier`.                                                                 |
            | 401         | ACCESS_DENIED                   | Access token missing, invalid or expired, or calling application not configured for this operation.                                        |
            | 404         | RESOURCE_NOT_FOUND              | No healthcare worker record found for the given CIS identifier.                                                                            |
            | 410         | INACTIVE_ACCOUNT                | The requested healthcare worker record is inactive in CIS.                                                                                 |
            | 429         | TOO_MANY_REQUESTS               | You have exceeded your application's [rate limit](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#rate-limits).  |

            For more details, see [HTTP status codes](https://digital.nhs.uk/developer/guides-and-documentation/reference-guide#http-status-codes).

          content:
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
              example:
                $ref: 'components/examples/GetHealthcareWorkerRoleDetailsResponseError.json'
components:
  securitySchemes:
    app-level3:
      $ref: https://proxygen.prod.api.platform.nhs.uk/components/securitySchemes/app-level3
  parameters:
    BearerAuthorization:
      in: header
      name: Authorization
      description: |
        The calling system's access token, which must be an OAuth 2.0 bearer token.
        For details, see [Application-restricted RESTful APIs - signed JWT authentication](https://digital.nhs.uk/developer/guides-and-documentation/security-and-authorisation/application-restricted-restful-apis-signed-jwt-authentication).

        Required in all environments except sandbox.
      required: false
      schema:
        type: string
        format: '^Bearer\ [[:ascii:]]+$'
        example: 'Bearer g1112R_ccQ1Ebbb4gtHBP1aaaNM'
    RequestId:
      in: header
      name: X-Request-Id
      description: |
        Unique identifier for the request, used for tracking and logging purposes.

        Must be a universally unique identifier (UUID) (ideally version 4).
      required: true
      schema:
        type: string
        format: uuid
      example: '6d3d3674-7ce5-11ec-90d6-0242ac121234'
    CorrelationId:
      in: header
      name: X-Correlation-Id
      description: |
        An optional ID which you can use to track transactions across multiple systems. It can take any value, but we recommend avoiding `.` characters.

        Mirrored back in a response header.
      required: false
      schema:
        type: string
      example: '11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA'
  headers:
    RequestId:
      description: The X-Request-Id from the request header, if supplied, mirrored back.
      schema:
        type: string
        format: uuid
        example: '6d3d3674-7ce5-11ec-90d6-0242ac121234'
    CorrelationId:
      description: The X-Correlation-Id from the request header, if supplied, mirrored back.
      schema:
        type: string
        example: 11C46F5F-CDEF-4865-94B2-0EE0EDCC26DA
  schemas:
    Bundle:
      type: object
      properties:
        resourceType:
          description: FHIR resource type.
          type: string
          enum: [Bundle]
        type:
          description: Indicates how the bundle is intended to be used.
          type: string
          enum: [searchset]
        total:
          description: Number of matching entries. Excludes related resources included in the bundle due to the use of the `_include` or `_revinclude` parameters.
          type: number
        entry:
          description: List of matching healthcare workers, roles and organisations.
          type: array
          items:
            $ref: "#/components/schemas/SearchEntry"
        link:
          description: A list of useful links.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              relation:
                description: The nature of the link. Always `self`, meaning it's a link to the resource endpoint that was called.
                type: string
                enum: [ "self" ]
              url:
                description: The link's URL.
                type: string
    SearchEntry:
      type: object
      properties:
        search:
          $ref: "#/components/schemas/SearchDetails"
        resource:
          oneOf:
            - $ref: "#/components/schemas/Practitioner"
            - $ref: "#/components/schemas/PractitionerRole"
            - $ref: "#/components/schemas/Organization"
        fullUrl:
          type: string
          description: URL for the resource.
          example: https://int.api.service.nhs.uk/healthcare-worker/Practitioner/123456789012
    SearchDetails:
      description: Search-related information for the resource.
      type: object
      properties:
        mode:
          description: |
            Indicates why this resource is in the result set.
            `match` indicates a direct match to the query.
            `include` indicates that the entry is linked to one of the matching entries, and that the relevant link was requested in the search.
          type: string
          enum: [match,include]
    Practitioner:
      description: A healthcare worker's personal details, formatted as a FHIR `Practitioner` resource.
      type: object
      properties:
        resourceType:
          description: FHIR resource type.
          type: string
          enum: [Practitioner]
        id:
          description: CIS identifier for the healthcare worker. Also known as their UUID or smartcard ID.
          type: string
          example: '123456789012'
        identifier:
          description: CIS identifier for the healthcare worker. Also known as their UUID or smartcard ID.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              system:
                type: string
                default: https://fhir.nhs.uk/Id/sds-user-id
              value:
                type: string
                example: '123456789012'
        active:
          description: Indicates whether the healthcare worker's account is active in CIS.
          type: boolean
          example: true
        name:
          description: Healthcare worker's name.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              use:
                type: string
                description: Identifies the purpose for this name.
                enum: [usual]
              family:
                description: That part of a person's name which is used to describe family, clan, tribal group, or marital association.
                type: string
                example: 'Smith'
              given:
                description: The forenames or given names of a person. Includes middle names.
                type: array
                minItems: 1
                items:
                  type: string
                  example: 'Jane Allison'
              prefix:
                type: array
                description: Standard form of address used to precede a person's name.
                maxItems: 1
                items:
                  type: string
                  example: 'Ms'
    PractitionerRole:
      description: |
        A healthcare worker role (sometimes called a 'role profile'), formatted as a FHIR `PractitionerRole` resource.
        A healthcare worker can have multiple roles, and each role is associated with a specific organisation.
        If the worker performs the same role in multiple organisations, there is a separate role profile for each organisation.
      type: object
      properties:
        resourceType:
          description: FHIR resource type.
          type: string
          enum: [PractitionerRole]
        id:
          description: Unique identifier for the role, sometimes called the role profile ID.
          type: string
        identifier:
          description: Unique identifier for the role, sometimes called the role profile ID.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              system:
                description: Coding system for the idenfier.
                type: string
                enum: [https://fhir.nhs.uk/Id/sds-role-profile-id]
              value:
                description: The identifier itself.
                type: string
                example: '123456789012'
        active:
          type: boolean
          description: Whether the role is active in CIS.
          example: True
        practitioner:
          $ref: '#/components/schemas/Reference'
        organization:
          $ref: '#/components/schemas/Reference'
        period:
          description: Time period during which the role applies, or applied.
          type: object
          properties:
            start:
              description: Start date for the period.
              type: string
            end:
              description: End date for the period.
              type: string
        code:
          description: Code for the role.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/CodeableConcept'
    Organization:
      description: |
        An organisation associated with one of the roles in the result set, formatted as a FHIR `Organization` resource.
      type: object
      properties:
        resourceType:
          description: FHIR resource type.
          type: string
          enum: [Organization]
        id:
          type: string
          description: ODS code for the organisation.
          example: V05266
        identifier:
          description: ODS code for the organisation.
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            properties:
              system:
                description: Coding system for the ODS code.
                type: string
                enum: [https://fhir.nhs.uk/Id/ods-organization-code]
              value:
                description: The ODS code itself.
                type: string
                example: 'V05266'
        name:
          description: Organisation name.
          type: string
          example: SILKSTONE PHARMACY
    Reference:
      type: object
      properties:
        reference:
          type: string
        identifier:
          type: object
          properties:
            system:
              type: string
            value:
              type: string
        display:
          type: string
    CodeableConcept:
      type: object
      properties:
        resourceType:
          type: string
          default: CodeableConcept
        coding:
          type: array
          items:
            type: object
            properties:
              resourceType:
                type: string
                default: Coding
              system:
                type: string
              code:
                type: string
              display:
                type: string
    OperationOutcome:
      type: object
      description: |
        Details of an error.
        There are a number of possible error codes that can be returned along with a more detailed description in the `display` field.
      properties:
        resourceType:
          type: string
          description: FHIR Resource Type.
          enum: [OperationOutcome]
        issue:
          type: array
          description: List of issues that have occurred.
          minItems: 1
          items:
            type: object
            required:
              - severity
              - code
            properties:
              severity:
                type: string
                enum: [fatal, error, warning, information]
                description: Severity of the error.
                example: error
              code:
                type: string
                description: FHIR error code.
                example: invalid
                enum:
                  - invalid
                  - structure
                  - required
                  - value
                  - invariant
                  - security
                  - login
                  - unknown
                  - expired
                  - forbidden
                  - suppressed
                  - processing
                  - not-supported
                  - duplicate
                  - multiple-matches
                  - not-found
                  - deleted
                  - too-long
                  - code-invalid
                  - extension
                  - too-costly
                  - business-rule
                  - conflict
                  - transient
                  - lock-error
                  - no-store
                  - exception
                  - timeout
                  - incomplete
                  - throttled
                  - informational
              details:
                type: object
                description: Internal error code.
                properties:
                  coding:
                    type: array
                    items:
                      type: object
                      properties:
                        system:
                          type: string
                          description: URI of the coding system specification.
                          example: https://fhir.nhs.uk/R4/CodeSystem/Spine-ErrorOrWarningCode
                        version:
                          type: string
                          description: Version of the coding system in use.
                          example: '1'
                        code:
                          type: string
                          description: Symbol in syntax defined by the system.
                          example: MISSING_PRACTITIONER_IDENTIFIER
                        display:
                          type: string
                          description: Representation defined by the system.
                          example: Missing practitioner identifier
